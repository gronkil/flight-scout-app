name: Release (dev -> main + APK)

# Pipeline promocyjny BEZ zadnych sekretow.
#
# PRZEPLYW:
#   push na 'dev'  ->  CI (Expo/RN): typy + testy + bundle
#                        \-- gdy ZIELONE ---> ten workflow:
#                              1) AWANS: fast-forward 'main' do zielonego commita
#                              2) BUILD:  expo prebuild + ./gradlew assembleRelease
#                              3) RELEASE: publikacja APK w GitHub Releases
#
# Dzieki temu 'main' zawsze wskazuje kod, ktory przeszedl CI, a APK powstaje
# DOKLADNIE z tego samego commita.
#
# Uwaga techniczna: awans i build sa w JEDNYM workflow celowo. Push do 'main'
# robiony tokenem GITHUB_TOKEN nie wyzwala kolejnych workflowow (ochrona GitHuba
# przed petla), wiec nie da sie wygodnie zlapac go osobnym 'on: push: main'.
# Sekwencyjny pipeline wyzwalany zielonym CI jest tu najpewniejszy.
#
# APK: podpisany stalym kluczem debug z szablonu Expo (kolejne wersje instaluja
# sie NA WIERZCH), versionCode = numer uruchomienia (rosnie).
on:
  workflow_run:
    workflows: ["CI (Expo/RN)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write   # awans 'main' + utworzenie Release z plikiem APK

jobs:
  release:
    runs-on: ubuntu-latest
    # Buduj tylko gdy: reczne uruchomienie ALBO CI zielone na galezi 'dev'.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'dev') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pelna historia potrzebna do fast-forward 'main'.
          fetch-depth: 0
          # Bazuj na 'main'; krok awansu przesunie ja do zielonego commita z 'dev'.
          ref: main

      - name: Awans main -> zielony commit z dev (fast-forward)
        # Tylko dla automatu (workflow_run). Przy recznym dispatchu budujemy 'main' jak jest.
        if: github.event_name == 'workflow_run'
        env:
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GREEN_SHA"
          # --ff-only: jesli 'main' rozjechala sie z 'dev', celowo przerywamy
          # zamiast nadpisywac historie (bezpieczna awaria).
          git merge --ff-only "$GREEN_SHA"
          git push origin HEAD:main
          echo "main awansowana do $GREEN_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Ustaw versionCode (rosnacy, dla update na wierzch)
        # Numer uruchomienia jako versionCode => kolejne APK instaluja sie jako aktualizacja.
        run: |
          node -e "
            const fs=require('fs');
            const p='app.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync(p, JSON.stringify(j,null,2));
            console.log('versionCode =', j.expo.android.versionCode);
          "

      - name: Wygeneruj projekt Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Zbuduj APK (Gradle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Przygotuj plik APK
        run: cp android/app/build/outputs/apk/release/app-release.apk flight-scout.apk

      - name: Opublikuj jako Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: flight-scout APK v${{ github.run_number }}
          body: |
            Aplikacja flight-scout (Android APK) — zbudowana na GitHub Actions (bez limitu EAS).
            Pobierz plik `flight-scout.apk` ponizej i zainstaluj na telefonie
            (zezwol na instalacje z nieznanych zrodel). Kolejne wersje instaluja sie na wierzch.
          files: flight-scout.apk
          draft: false
          prerelease: false
