name: CI (Expo/RN)

# Bramka jakości aplikacji: typy (TS strict) + testy rdzenia (Vitest) + bundle.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Typy (tsc strict)
        run: npm run typecheck

      - name: Testy rdzenia (Vitest)
        run: npm run test

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Zbuduj bundle (expo export, android)
        run: npx expo export --platform android --output-dir dist

      - name: Wrzuc bundle jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: mobile-bundle
          path: dist
          if-no-files-found: error
